<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Imágenes — Residencial Monarca</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A5D4E;
            --primary-dark: #374439;
            --accent: #D4A373;
            --bg-light: #F9F8F6;
            --text-main: #2C352D;
            --text-muted: #52504A;
            --white: #FFFFFF;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-main); }
        h1, .brand-font { font-family: 'Playfair Display', serif; }
        .preview-canvas { max-width: 100%; height: auto; }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-accent { background: var(--accent); color: var(--white); }
        .btn-accent:hover { filter: brightness(0.92); }
        .focus-ring:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(212,163,115,0.25); }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 border-b pb-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4" style="border-color:#E7E3DC;">
            <div>
                <h1 class="text-3xl font-bold tracking-tight" style="color:var(--primary-dark);">Subir de Imágenes</h1>
                <p class="text-sm mt-1" style="color:var(--text-muted);">El lugar único para optimizar y subir fotos de <strong>Residencial Monarca</strong></p>
            </div>
            <div class="flex flex-wrap items-end gap-4 bg-white p-3 rounded-xl border" style="border-color:#E7E3DC;">
                <div>
                    <label for="globalCategory" class="text-sm font-medium block mb-1" style="color:var(--text-muted);">Carpeta por defecto</label>
                    <select id="globalCategory" class="border rounded px-2 py-1.5 text-sm focus-ring" style="border-color:#D8D3C8; color:var(--primary-dark);"></select>
                </div>
                <div>
                    <label for="globalMaxWidth" class="text-sm font-medium block mb-1" style="color:var(--text-muted);">Ancho Máx. (px)</label>
                    <select id="globalMaxWidth" class="border rounded px-2 py-1.5 text-sm focus-ring" style="border-color:#D8D3C8; color:var(--primary-dark);">
                        <option value="800">800 px (Liviana)</option>
                        <option value="1200" selected>1200 px (Estándar)</option>
                        <option value="1600">1600 px (Intermedia)</option>
                        <option value="1920">1920 px (Alta / HD)</option>
                        <option value="0">Original (Sin redimensionar)</option>
                    </select>
                </div>
                <div>
                    <label for="globalTitle" class="text-sm font-medium block mb-1" style="color:var(--text-muted);">Título global</label>
                    <input type="text" id="globalTitle" placeholder="Ej.: Fiesta 2026" class="border rounded px-2 py-1.5 text-sm focus-ring" style="border-color:#D8D3C8; color:var(--primary-dark);">
                </div>
                <div class="flex items-center gap-2 border-l pl-4" style="border-color:#E7E3DC;">
                    <input type="checkbox" id="globalKeepOriginal" checked class="w-4 h-4 cursor-pointer" style="accent-color:var(--accent);">
                    <label for="globalKeepOriginal" class="text-sm cursor-pointer">Respetar nombre</label>
                </div>
                <div class="flex items-center gap-2 border-l pl-4" style="border-color:#E7E3DC;">
                    <label for="globalQuality" class="text-sm">Calidad (<span id="qualityVal">80</span>%)</label>
                    <input type="range" id="globalQuality" min="40" max="100" value="80" class="cursor-pointer w-24" style="accent-color:var(--accent);">
                </div>
            </div>
        </header>

        <p class="text-sm mb-8" style="color:var(--text-main);">
            Ajusta los píxeles máximos y la barra de compresión según prefieras. Cada tarjeta calculará automáticamente el peso final resultante frente al original.
        </p>

        <!-- Zona de Carga -->
        <div class="mb-8">
            <label for="fileInput" class="border-2 border-dashed rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition-all duration-200 group bg-white"
                   style="border-color:#D8D3C8;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='#D8D3C8'">
                <svg class="w-12 h-12 mb-3 transition-colors" style="color:var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-sm font-medium" style="color:var(--text-main);">Arrastra tus imágenes aquí o <span class="underline" style="color:var(--primary);">haz clic para buscar</span></span>
                <span class="text-sm mt-1" style="color:var(--text-muted);">Soporta múltiples archivos PNG, JPG, WEBP</span>
                <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Acciones Globales -->
        <div id="batchActions" class="hidden mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-xl border" style="border-color:#E7E3DC;">
            <span id="counterText" class="text-sm font-medium">0 imágenes cargadas</span>
            <div class="flex gap-2">
                <button id="uploadAllBtn" class="btn-primary font-bold px-5 py-2 rounded-lg text-sm transition-colors shadow-sm cursor-pointer">
                    Subir todas a Cloudinary
                </button>
                <button id="downloadAllBtn" class="btn-accent font-bold px-5 py-2 rounded-lg text-sm transition-colors shadow-sm cursor-pointer">
                    Descargar todas (.WebP)
                </button>
            </div>
        </div>

        <!-- Contenedor de Tarjetas -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const cfgCloudinary = (typeof CONFIG !== 'undefined' && CONFIG.CLOUDINARY) ? CONFIG.CLOUDINARY : {};
        const CLOUD_NAME = cfgCloudinary.CLOUD_NAME;
        const UPLOAD_PRESET = cfgCloudinary.UPLOAD_PRESET;
        const BASE_FOLDER = cfgCloudinary.CARPETA_BASE;
        const NEW_FOLDER_OPTION = '__nueva__';
        const LAST_FOLDER_KEY = 'monarca_ultima_carpeta_v1';

        const fileInput = document.getElementById('fileInput');
        const cardsContainer = document.getElementById('cardsContainer');
        const globalCategory = document.getElementById('globalCategory');
        const globalMaxWidth = document.getElementById('globalMaxWidth');
        const globalTitle = document.getElementById('globalTitle');
        const globalKeepOriginal = document.getElementById('globalKeepOriginal');
        const globalQuality = document.getElementById('globalQuality');
        const qualityVal = document.getElementById('qualityVal');
        const batchActions = document.getElementById('batchActions');
        const counterText = document.getElementById('counterText');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const uploadAllBtn = document.getElementById('uploadAllBtn');

        const FOLDERS_KEY = 'monarca_subcarpetas_v1';
        const DEFAULT_FOLDERS = [
            { value: 'galeria', label: 'Galería' },
            { value: 'instalaciones', label: 'Instalaciones' }
        ];

        function loadFolders() {
            try {
                const stored = JSON.parse(localStorage.getItem(FOLDERS_KEY));
                if (Array.isArray(stored) && stored.length) return stored;
            } catch {}
            return [...DEFAULT_FOLDERS];
        }

        function saveFolders(list) {
            try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(list)); }
            catch (e) { console.error('No se pudo guardar la lista de carpetas:', e); }
        }

        function getLastFolder() {
            const last = localStorage.getItem(LAST_FOLDER_KEY);
            const folders = loadFolders();
            const defaultFolder = cfgCloudinary.CARPETA_DEFAULT || folders[0].value;
            return (last && folders.find(f => f.value === last)) ? last : defaultFolder;
        }

        function setLastFolder(value) {
            try { localStorage.setItem(LAST_FOLDER_KEY, value); } catch {}
        }

        function slugifyFolder(name) {
            return name.trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '');
        }

        function buildFolderOptionsHtml(selectedValue) {
            const folders = loadFolders();
            const opts = folders.map(f =>
                `<option value="${f.value}" ${f.value === selectedValue ? 'selected' : ''}>${f.label}</option>`
            ).join('');
            return opts + `<option value="${NEW_FOLDER_OPTION}">+ Crear nueva carpeta…</option>`;
        }

        function populateGlobalCategory(selectedValue) {
            globalCategory.innerHTML = buildFolderOptionsHtml(selectedValue || getLastFolder());
        }
        populateGlobalCategory(getLastFolder());

        function handleFolderSelectChange(selectEl, onResolved) {
            if (selectEl.value !== NEW_FOLDER_OPTION) {
                onResolved(selectEl.value);
                return;
            }
            const raw = prompt('Nombre de la nueva carpeta (ej: "Eventos", "Equipo"):');
            const slug = raw ? slugifyFolder(raw) : '';
            if (!slug) {
                selectEl.value = getLastFolder();
                onResolved(selectEl.value);
                return;
            }
            const folders = loadFolders();
            if (!folders.find(f => f.value === slug)) {
                folders.push({ value: slug, label: raw.trim() });
                saveFolders(folders);
            }
            onResolved(slug);
        }

        globalCategory.addEventListener('change', () => {
            handleFolderSelectChange(globalCategory, (finalValue) => {
                populateGlobalCategory(finalValue);
                setLastFolder(finalValue);
                imageFiles.forEach(item => { item.category = finalValue; });
                renderCards();
            });
        });

        let imageFiles = [];

        globalQuality.addEventListener('input', (e) => {
            qualityVal.textContent = e.target.value;
            const q = parseInt(e.target.value) / 100;
            imageFiles.forEach(item => { item.quality = q; });
            imageFiles.forEach((_, idx) => drawPreviewAndMeasure(idx));
        });

        globalMaxWidth.addEventListener('change', () => {
            const maxWidthVal = parseInt(globalMaxWidth.value);
            imageFiles.forEach(item => { item.maxWidth = maxWidthVal; });
            renderCards();
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let processedCount = 0;
            const defaultFolder = globalCategory.value === NEW_FOLDER_OPTION ? getLastFolder() : globalCategory.value;

            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const randomStr = Math.random().toString(36);
                        const fileDate = file.lastModified ? new Date(file.lastModified) : new Date();
                        const rawName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                        const keepOrig = globalKeepOriginal.checked;

                        const imgData = {
                            id: randomStr.substring(2, 9),
                            fileObj: file,
                            imgElement: img,
                            originalSize: file.size,
                            timestamp: fileDate.getTime(),
                            keepOriginal: keepOrig,
                            originalName: rawName,
                            customName: 'imagen',
                            category: defaultFolder,
                            customTitle: globalTitle.value.trim(),
                            customDescription: '',
                            maxWidth: parseInt(globalMaxWidth.value),
                            dateStr: getFormattedDate(fileDate),
                            quality: parseInt(globalQuality.value) / 100
                        };
                        imageFiles.push(imgData);
                        processedCount++;

                        if (processedCount === files.filter(f => f.type.startsWith('image/')).length) {
                            sortImages();
                            renderCards();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        globalKeepOriginal.addEventListener('change', () => {
            const val = globalKeepOriginal.checked;
            imageFiles.forEach(item => { item.keepOriginal = val; });
            renderCards();
        });

        function getFormattedDate(dateObj) {
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            const ss = String(dateObj.getSeconds()).padStart(2, '0');
            return `${yyyy}${mm}${dd}${hh}${min}${ss}`;
        }

        function sortImages() {
            imageFiles.sort((a, b) => b.timestamp - a.timestamp);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, dm = 2;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        function getFinalName(item) {
            return item.keepOriginal ? item.originalName : `${item.dateStr}_${item.customName || 'imagen'}`;
        }

        function getScaledDimensions(img, maxWidth) {
            let width = img.naturalWidth;
            let height = img.naturalHeight;
            if (maxWidth > 0 && width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }
            return { width, height };
        }

        function renderCards() {
            cardsContainer.innerHTML = '';
            if (imageFiles.length > 0) {
                batchActions.classList.remove('hidden');
                counterText.textContent = `${imageFiles.length} ${imageFiles.length === 1 ? 'imagen cargada' : 'imágenes cargadas'}`;
            } else {
                batchActions.classList.add('hidden');
            }

            imageFiles.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border p-4 flex flex-col gap-3 shadow-sm";
                card.style.borderColor = '#E7E3DC';

                const finalGeneratedName = `${getFinalName(item)}.webp`;

                card.innerHTML = `
                    <div class="relative rounded-lg overflow-hidden aspect-video flex items-center justify-center border" style="background:#F1EFEA; border-color:#E7E3DC;">
                        <canvas id="canvas-${index}" class="preview-canvas object-contain w-full h-full"></canvas>
                    </div>
                    <div class="flex flex-col gap-2 text-sm">
                        <div class="flex justify-between items-center text-sm" style="color:var(--text-muted);">
                            <span>Original: <strong style="color:var(--text-main);">${formatBytes(item.originalSize)}</strong></span>
                            <div class="flex items-center gap-1.5">
                                <input type="checkbox" data-index="${index}" class="card-keep-original w-3.5 h-3.5 cursor-pointer" style="accent-color:var(--accent);" ${item.keepOriginal ? 'checked' : ''}>
                                <span class="cursor-pointer">Respetar nombre</span>
                            </div>
                        </div>

                        ${item.keepOriginal ? `
                            <div class="w-full border rounded px-2 py-1.5 text-sm truncate" style="border-color:#E7E3DC; color:var(--text-muted); background:#F9F8F6;">
                                ${item.originalName}
                            </div>
                        ` : `
                            <input type="text" value="${item.customName}" data-index="${index}" placeholder="Nombre corto..." class="custom-name-input w-full border rounded px-2 py-1 text-sm focus-ring" style="border-color:#D8D3C8;">
                        `}

                        <div class="grid grid-cols-2 gap-2 mt-1">
                            <div>
                                <label class="text-sm" style="color:var(--text-muted);">Carpeta:</label>
                                <select data-index="${index}" class="category-select w-full border rounded px-2 py-1 text-sm focus-ring" style="border-color:#D8D3C8;">
                                    ${buildFolderOptionsHtml(item.category)}
                                </select>
                            </div>
                            <div>
                                <label class="text-sm" style="color:var(--text-muted);">Ancho máx. (px):</label>
                                <select data-index="${index}" class="card-maxwidth-select w-full border rounded px-2 py-1 text-sm focus-ring" style="border-color:#D8D3C8;">
                                    <option value="800" ${item.maxWidth === 800 ? 'selected' : ''}>800 px</option>
                                    <option value="1200" ${item.maxWidth === 1200 ? 'selected' : ''}>1200 px</option>
                                    <option value="1600" ${item.maxWidth === 1600 ? 'selected' : ''}>1600 px</option>
                                    <option value="1920" ${item.maxWidth === 1920 ? 'selected' : ''}>1920 px</option>
                                    <option value="0" ${item.maxWidth === 0 ? 'selected' : ''}>Original</option>
                                </select>
                            </div>
                            <div class="col-span-2">
                                <label class="text-sm" style="color:var(--text-muted);">Título:</label>
                                <input type="text" value="${escapeHtml(item.customTitle)}" data-index="${index}" placeholder="Título de la actividad" class="title-input w-full border rounded px-2 py-1 text-sm focus-ring" style="border-color:#D8D3C8;">
                            </div>
                            <div class="col-span-2">
                                <label class="text-sm" style="color:var(--text-muted);">Descripción:</label>
                                <textarea data-index="${index}" placeholder="Descripción (opcional)" class="description-input w-full border rounded px-2 py-1 text-sm focus-ring" rows="2" style="border-color:#D8D3C8;">${escapeHtml(item.customDescription)}</textarea>
                            </div>
                        </div>
                        <div class="text-sm truncate mt-1 p-1.5 rounded border flex justify-between items-center" style="background:#F9F8F6; border-color:#E7E3DC; color:var(--primary-dark);">
                            <span class="truncate"><span style="color:var(--text-muted);">${BASE_FOLDER}/${item.category}/</span>${finalGeneratedName}</span>
                            <span id="size-badge-${index}" class="text-sm px-1.5 py-0.5 rounded shrink-0" style="background:#F1EFEA; color:var(--text-muted);">Calculando...</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t mt-auto gap-2 flex-wrap" style="border-color:#E7E3DC;">
                        <button data-index="${index}" class="delete-btn text-sm font-medium cursor-pointer" style="color:#B85C5C;">Eliminar</button>
                        <div class="flex items-center gap-2 flex-wrap justify-end">
                            <span id="upload-status-${index}" class="text-sm px-1.5 py-0.5 rounded shrink-0" style="background:#F1EFEA; color:var(--text-muted);">Sin subir</span>
                            <button data-index="${index}" class="upload-btn font-bold px-3 py-1.5 rounded text-sm transition-colors cursor-pointer" style="background:var(--primary); color:white;">Subir a Cloudinary</button>
                            <button data-index="${index}" class="download-single-btn font-bold px-3 py-1.5 rounded text-sm transition-colors cursor-pointer" style="background:var(--accent); color:white;">Descargar WebP</button>
                        </div>
                    </div>
                `;

                cardsContainer.appendChild(card);
                drawPreviewAndMeasure(index);
            });

            attachEvents();
        }

        function drawPreviewAndMeasure(index) {
            const item = imageFiles[index];
            const canvas = document.getElementById(`canvas-${index}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const { width, height } = getScaledDimensions(item.imgElement, item.maxWidth);
            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(item.imgElement, 0, 0, width, height);

            canvas.toBlob((blob) => {
                const badge = document.getElementById(`size-badge-${index}`);
                if (badge) {
                    const newSize = blob.size;
                    const diff = newSize - item.originalSize;
                    const diffPercent = Math.round((diff / item.originalSize) * 100);
                    badge.textContent = `${formatBytes(newSize)} (${diffPercent > 0 ? '+' : ''}${diffPercent}%)`;
                    badge.style.color = newSize < item.originalSize ? '#3F6B4F' : '#B08A4E';
                    badge.style.background = newSize < item.originalSize ? '#E9F1EA' : '#F6EEE1';
                }
            }, 'image/webp', item.quality);
        }

        function buildProcessedBlob(item) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const { width, height } = getScaledDimensions(item.imgElement, item.maxWidth);
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(item.imgElement, 0, 0, width, height);
                canvas.toBlob((blob) => resolve(blob), 'image/webp', item.quality);
            });
        }

        function attachEvents() {
            document.querySelectorAll('.custom-name-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles[idx].customName = e.target.value;
                });
            });

            document.querySelectorAll('.card-keep-original').forEach(chk => {
                chk.addEventListener('change', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles[idx].keepOriginal = e.target.checked;
                    renderCards();
                });
            });

            document.querySelectorAll('.title-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles[idx].customTitle = e.target.value;
                });
            });

            document.querySelectorAll('.description-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles[idx].customDescription = e.target.value;
                });
            });

            document.querySelectorAll('.card-maxwidth-select').forEach(sel => {
                sel.addEventListener('change', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles[idx].maxWidth = parseInt(e.target.value);
                    drawPreviewAndMeasure(idx);
                });
            });

            document.querySelectorAll('.category-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const idx = e.target.dataset.index;
                    handleFolderSelectChange(select, (finalValue) => {
                        imageFiles[idx].category = finalValue;
                        renderCards();
                    });
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    imageFiles.splice(idx, 1);
                    renderCards();
                });
            });

            document.querySelectorAll('.download-single-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    downloadItem(idx);
                });
            });

            document.querySelectorAll('.upload-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.target.dataset.index;
                    uploadToCloudinary(idx);
                });
            });

            downloadAllBtn.onclick = () => {
                imageFiles.forEach((_, idx) => {
                    setTimeout(() => downloadItem(idx), idx * 250);
                });
            };

            uploadAllBtn.onclick = () => {
                imageFiles.forEach((_, idx) => {
                    setTimeout(() => uploadToCloudinary(idx), idx * 400);
                });
            };
        }

        async function downloadItem(index) {
            const item = imageFiles[index];
            const blob = await buildProcessedBlob(item);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${getFinalName(item)}.webp`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function uploadToCloudinary(index) {
            const item = imageFiles[index];
            const statusEl = document.getElementById(`upload-status-${index}`);
            const folderPath = `${BASE_FOLDER}/${item.category}`;
            const tag = `${BASE_FOLDER}_${item.category}`;

            if (statusEl) {
                statusEl.textContent = 'Subiendo…';
                statusEl.style.background = '#F1EFEA';
                statusEl.style.color = 'var(--text-muted)';
            }

            try {
                if (!CLOUD_NAME || !UPLOAD_PRESET || !BASE_FOLDER) {
                    throw new Error('Falta configuración de Cloudinary en js/config.js.');
                }
                const blob = await buildProcessedBlob(item);
                const finalName = getFinalName(item);

                const formData = new FormData();
                formData.append('file', blob, `${finalName}.webp`);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('public_id', finalName);
                formData.append('folder', folderPath);
                formData.append('tags', tag);

                const title = (item.customTitle || '').trim().replace(/[|]/g, ' ');
                const description = (item.customDescription || '').trim().replace(/[|]/g, ' ');
                const context = [
                    title ? `caption=${title}` : '',
                    description ? `alt=${description}` : ''
                ].filter(Boolean).join('|');
                if (context) {
                    formData.append('context', context);
                }

                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (!res.ok) throw new Error((data.error && data.error.message) || 'Error desconocido de Cloudinary');

                if (statusEl) {
                    statusEl.textContent = `✓ ${folderPath}/`;
                    statusEl.style.background = '#E9F1EA';
                    statusEl.style.color = '#3F6B4F';
                    statusEl.title = data.secure_url;
                }
            } catch (err) {
                console.error('Error subiendo a Cloudinary:', err);
                if (statusEl) {
                    statusEl.textContent = 'Error ✕';
                    statusEl.style.background = '#F5E7E7';
                    statusEl.style.color = '#B85C5C';
                    statusEl.title = err.message;
                }
            }
        }
    </script>
</body>
</html>
