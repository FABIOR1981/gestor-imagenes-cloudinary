<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Archivos | Gestor de Imágenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/subir.css">
</head>
<body>
    <div class="contenedor">

        <div id="loadingState" class="centro">
            <p class="suave">Validando acceso seguro…</p>
        </div>

        <div id="errorState" class="panel centro error hidden">
            <h1>Enlace no válido o caducado</h1>
            <p id="errorMessage" class="suave">Por seguridad, los enlaces de subida tienen una fecha límite. Solicita uno nuevo al administrador.</p>
        </div>

        <main id="mainInterface" class="hidden">

            <header class="panel">
                <div class="cabecera">
                    <div>
                        <span class="etiqueta">Portal seguro</span>
                        <h1>Envío de archivos</h1>
                        <p class="suave">Proyecto: <strong id="displayProjectName"></strong></p>
                        <p class="vence">Válido hasta: <span id="displayExpDate"></span></p>
                    </div>
                </div>
                <div class="ajustes">
                    <div class="campo">
                        <label for="globalCategory">Carpeta destino</label>
                        <select id="globalCategory"></select>
                    </div>
                    <div class="campo">
                        <label for="globalMaxWidth">Ancho máximo</label>
                        <select id="globalMaxWidth">
                            <option value="800">800 px (liviana)</option>
                            <option value="1200" selected>1200 px (estándar)</option>
                            <option value="1600">1600 px (intermedia)</option>
                            <option value="1920">1920 px (HD)</option>
                            <option value="0">Original</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="globalQuality">Calidad WebP</label>
                        <select id="globalQuality">
                            <option value="0.6">Baja (más liviana)</option>
                            <option value="0.8" selected>Media</option>
                            <option value="0.92">Alta</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="globalTitle">Título global</label>
                        <input type="text" id="globalTitle" placeholder="Ej.: Actividad 2026">
                    </div>
                    <div class="campo" style="align-self:end">
                        <label class="check"><input type="checkbox" id="globalKeepOriginal" checked> Respetar nombre original</label>
                    </div>
                </div>
            </header>

            <label id="dropzone" class="zona" for="fileInput">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.6-4.6a2 2 0 012.8 0L16 16m-2-2l1.6-1.6a2 2 0 012.8 0L20 14M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <strong>Toca para elegir imágenes o arrástralas aquí</strong>
                <span class="suave">Puedes seleccionar varias (JPG, PNG, WEBP…)</span>
                <input type="file" id="fileInput" class="sr-only" multiple accept="image/*">
            </label>

            <p id="aviso" class="aviso hidden" role="status"></p>

            <div id="cardsContainer" class="grilla"></div>
        </main>
    </div>

    <div id="batchActions" class="barra hidden">
        <div class="progreso"><div id="progressBar"></div></div>
        <div class="barra-int">
            <strong id="counterText">0 imágenes</strong>
            <div class="acciones">
                <button id="downloadAllBtn" class="btn btn-secundario" type="button">Descargar .webp</button>
                <button id="uploadAllBtn" class="btn btn-primario" type="button">Subir todas</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/subir.js"></script>
</body>
</html>
