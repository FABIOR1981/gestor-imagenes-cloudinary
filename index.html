<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Upload Hub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="dashboard-container">
        <header>
            <div class="hero-icono">🔗</div>
            <h1>Generador de Enlaces</h1>
            <p>Crea links de subida temporales para tus clientes.</p>
        </header>

        <section class="card">
            <form id="linkGeneratorForm">
                <div class="form-group">
                    <label for="projectSelect"><span class="numero-paso">1</span> ¿Para qué proyecto es?</label>
                    <select id="projectSelect" name="projectSelect" class="border rounded px-3 py-2 w-full" required>
                        <option value="">Cargando proyectos...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="modeSelect"><span class="numero-paso">2</span> ¿Quién usará el enlace?</label>
                    <select id="modeSelect" name="modeSelect" required>
                        <option value="admin">Admin - todas las opciones</option>
                        <option value="cliente">Cliente - carga simplificada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expirationDate"><span class="numero-paso">3</span> ¿Hasta cuándo estará activo?</label>
                    <input type="datetime-local" id="expirationDate" name="expirationDate" required>
                    <p class="ayuda">Por defecto el enlace dura 24 horas. Puedes cambiarlo.</p>
                </div>

                <button type="submit" class="btn-primary">✨ Generar enlace</button>
            </form>
        </section>

        <!-- Contenedor oculto hasta que se genera el link -->
        <section id="resultContainer" class="card result-card hidden">
            <h2>✅ ¡Enlace listo!</h2>
            <p>Copia este link y envíaselo al cliente:</p>
            <div class="copy-wrapper">
                <input type="text" id="generatedLink" readonly>
                <button type="button" id="copyBtn" class="btn-secondary">📋 Copiar</button>
            </div>
            <p id="copyStatus" class="status-msg"></p>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
